# Local development environment for the HRIS (replaces XAMPP).
#
#   docker compose up -d            start everything
#   docker compose exec api php artisan db:seed     first run only: sample data
#                                   (migrations run by themselves on every start)
#   docker compose logs -f api      follow the API
#   docker compose down             stop (data kept in the mysql-data volume)
#
# Ports on the host:
#   8090  Laravel API    — the mobile app (10.0.2.2:8090) and the web proxy use it
#   5173  Web portal     — React + Vite, hot reload
#   8081  phpMyAdmin     — the XAMPP-style database browser
#   3307  MySQL 8.0      — for a desktop client; 3307 so it never clashes with a
#                          leftover XAMPP MySQL on 3306
#
# Redis Cluster (cache): six nodes, three primaries with a replica each, on the
# compose network only — no host ports, because cluster clients are redirected
# to node addresses that only resolve inside it. Reach it with
#   docker compose exec redis-1 redis-cli cluster info
#   docker compose exec redis-1 redis-cli --cluster check redis-1:6379
# Killing a primary (docker compose stop redis-1) promotes its replica; killing
# the whole cluster only makes the API slower, never wrong — every cached read
# falls back to MySQL.
#
# The React Native app is NOT containerised: Metro and the Android emulator run
# on the host as before, and reach the API through the published 8090.
#
# Every credential here is a throwaway development value. Nothing in this file
# is used by, or suitable for, a deployed server.

x-api: &api
  image: hris-api:dev
  build: ./backend
  working_dir: /var/www/html
  volumes:
    - ./backend:/var/www/html
    # vendor/ in a named volume: built for Linux inside the container, and much
    # faster than reading thousands of PHP files across the Windows bind mount.
    - api-vendor:/var/www/html/vendor
  # `redis` as well as the default: a cluster client is redirected to each
  # node's own address, which only resolves on the network the nodes are on.
  networks: [default, redis]
  environment: &api-env
    # Real environment variables win over backend/.env (Laravel loads .env
    # without overwriting), so the containers reach MySQL by service name while
    # backend/.env stays usable from the host.
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: hris
    DB_USERNAME: hris
    DB_PASSWORD: secret
    APP_URL: http://localhost:8090
    # Cache on the Redis cluster. The seed list is only a starting point:
    # phpredis learns the topology from whichever node answers first, so the
    # API follows a failover without being restarted.
    #
    # The store is `failover` (config/cache.php), not `redis`: Redis first,
    # then the database store whenever Redis cannot answer. That covers every
    # cache user, not only the reads that go through ResilientCache — the
    # login throttle is one, and a cache hiccup must never stop a sign-in.
    CACHE_STORE: failover
    REDIS_CLIENT: phpredis
    REDIS_CACHE_CONNECTION: cluster
    # Seeds by address, not by name, and all six. Measured against a stopped
    # node: looking up its name took 8s to fail (Docker's DNS), connecting to
    # its fixed address took the 0.5s connect timeout. By name, a dead seed
    # made about one request in three take seconds even after its replica had
    # taken over. All six, because after a failover the primaries may be the
    # nodes that started as replicas — seeds limited to redis-1..3 could not
    # find a cluster whose first three nodes were all down. The addresses are
    # the fixed ones given to redis-1..6 below.
    REDIS_CLUSTER_NODES: "172.28.200.11:6379,172.28.200.12:6379,172.28.200.13:6379,172.28.200.14:6379,172.28.200.15:6379,172.28.200.16:6379"

x-redis: &redis
  image: redis:7-alpine
  # Cache only: no appendonly, no RDB snapshots. Losing a node loses cached
  # copies, never data — MySQL holds everything that matters.
  command:
    - redis-server
    - --cluster-enabled
    - "yes"
    - --cluster-config-file
    - nodes.conf
    - --cluster-node-timeout
    - "5000"
    - --appendonly
    - "no"
    - --save
    - ""
    - --protected-mode
    - "no"
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 20

services:
  mysql:
    # MySQL 8.0 per the fixed stack (CLAUDE.md §2). XAMPP shipped MariaDB 10.4.
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: hris
      MYSQL_USER: hris
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    <<: *api
    environment:
      <<: *api-env
      # Migrations run on every start, so a teammate who pulls new ones only
      # has to restart. Seeding stays manual: it would reset edited dev data.
      HRIS_MIGRATE_ON_START: "true"
      PHP_CLI_SERVER_WORKERS: 4
    # --no-reload: without it, `artisan serve` strips every variable not on its
    # passthrough list before starting PHP — including DB_HOST above — and the
    # API would fall back to backend/.env. It is also required for the workers.
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8090", "--no-reload"]
    ports:
      - "8090:8090"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8090/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  scheduler:
    # Runs the Laravel scheduler — Phase 7's crews:end-expired-covers ends
    # acting foreman covers on time.
    <<: *api
    environment:
      <<: *api-env
      # The api container installs vendor/; two installs into one volume race.
      HRIS_SKIP_INSTALL: "true"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./web:/app
      # node_modules in a named volume: the host's copy holds Windows builds of
      # native packages (Tailwind's oxide, Vite's bundler) that Linux cannot load.
      - web-node-modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://api:8090
      # File change events do not cross from a Windows folder into a Linux
      # container, so Vite polls instead or hot reload never fires.
      VITE_USE_POLLING: "true"
    command: ["sh", "docker/dev.sh"]
    ports:
      - "5173:5173"
    depends_on:
      # Healthy, not merely started: on a first run the API spends a minute
      # installing packages, and the proxy would answer 502 until it is up.
      api:
        condition: service_healthy

  # Fixed addresses, and this is load-bearing. A node remembers the cluster in
  # nodes.conf, which survives a restart (the image keeps /data in a volume),
  # but Docker hands addresses out afresh each time containers start. Measured
  # here: after a recreate, redis-5 was given redis-1's old address, so its
  # saved topology said its own primary was itself; the others listed it as
  # `noaddr`. cluster_state still read ok and replication looked healthy from
  # each node's side, while two of three primaries had a replica the cluster
  # could not reach and so could not vote in — the failover this exists to
  # demonstrate was quietly gone. With fixed addresses, what a node remembers
  # stays true.
  redis-1:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.200.11}}
  redis-2:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.200.12}}
  redis-3:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.200.13}}
  redis-4:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.200.14}}
  redis-5:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.200.15}}
  redis-6:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.200.16}}

  redis-cluster-init:
    # Runs once per `up`, then exits: it forms the cluster (three primaries,
    # one replica each) if it is not formed already, so restarting the stack
    # does not tear a working cluster down.
    image: redis:7-alpine
    restart: "no"
    networks: [redis]
    depends_on:
      redis-1: {condition: service_healthy}
      redis-2: {condition: service_healthy}
      redis-3: {condition: service_healthy}
      redis-4: {condition: service_healthy}
      redis-5: {condition: service_healthy}
      redis-6: {condition: service_healthy}
    entrypoint: ["sh", "-c"]
    # One folded line: every line here is indented the same, so YAML joins them
    # with spaces. Indenting any of them further would keep the newline and
    # split the command into pieces.
    command:
      - >
        if redis-cli -h redis-1 cluster info 2>/dev/null | grep -q 'cluster_state:ok';
        then echo 'Redis cluster already formed.';
        else redis-cli --cluster create
        redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379
        --cluster-replicas 1 --cluster-yes;
        fi

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: mysql
      # Signs straight in, as XAMPP's did. Development only.
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

networks:
  default:
  redis:
    # A /24 of its own for the cache nodes' fixed addresses (see redis-1).
    # Chosen clear of Docker's usual 172.17–172.19; if it clashes with another
    # network on a teammate's machine, change the subnet and the six addresses
    # together, then `docker compose down` and `up` to form a fresh cluster.
    ipam:
      config:
        - subnet: 172.28.200.0/24

volumes:
  mysql-data:
  api-vendor:
  web-node-modules:
