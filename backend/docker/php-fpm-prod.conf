; php-fpm pool override, loaded after the image's www.conf (zz- sorts last).
; Keeps the worst case under the 1g container limit: 3 x 256M (per-worker
; php memory_limit) + opcache's shared 128M segment + the FPM master fits in
; ~950M, so a genuine spike fails with a legible PHP memory error instead of
; the kernel OOM-killing the container.
[www]
pm.max_children = 3