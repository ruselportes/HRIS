; php-fpm pool override, loaded after the image's www.conf (zz- sorts last).
; Keep the worst case under the 1g container limit: 4 workers x 256M peaks at
; 1g, so a genuine spike fails with a legible PHP memory error instead of the
; kernel OOM-killing the container mid-request (50 MB over 1g).
[www]
pm.max_children = 4