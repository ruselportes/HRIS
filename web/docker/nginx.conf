server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Cloudflare/cloudflared add a Via header, which makes nginx treat the
    # request as proxied; without gzip_proxied any, gzip silently skips exactly
    # the tunnel path where bandwidth matters most.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Laravel: the API is the only thing served by PHP. SCRIPT_FILENAME is a
    # path inside the api container, so nginx needs no copy of the backend.
    # nginx is the only entry to PHP (LAN client or cloudflared), so it appends
    # the real client to X-Forwarded-For and echoes the scheme through. Laravel
    # trusts only the Docker bridge CIDR (bootstrap/app.php), keeping spoofed
    # client-supplied XFF values out. Host/Port headers are deliberately not
    # forwarded: they stay client-controlled and Laravel does not trust them.
    location /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_read_timeout 60s;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # Vite fingerprints everything in /assets, so it can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router uses BrowserRouter, so unknown paths fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
