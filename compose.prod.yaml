# Production deployment for the HRIS (the old-PC Ubuntu server).
# compose.yaml next to this file is the DEV setup and is not used here.
#
# One-time setup, on the server, in the repo root:
#   cp .env.prod.example .env.prod          then fill in every value in it
#   alias hris='docker compose --env-file .env.prod -f compose.prod.yaml'
#
# Deploy / update:
#   git pull && hris up -d --build          first build takes several minutes
#   hris ps                                 all services should be healthy
#   hris logs -f api
#
# First run only (full walk-through: docs/DEPLOYMENT.md). Load the reference
# data the system cannot start without, then make the first administrator —
# it asks for a password, hidden, and everyone else is made from the app:
#   hris exec -u www-data api php artisan db:seed --class=RoleSeeder --force
#   hris exec -u www-data api php artisan db:seed --class=HolidaySeeder --force
#   hris exec -u www-data api php artisan hris:make-admin
# Do NOT run a bare `db:seed`: EmployeeSeeder creates sample accounts,
# including an admin, whose password is literally "password". The seeded
# worker dates of birth are public too, so a seeded database lets anyone
# activate a demo worker's portal account (Add-on B) — demo-only data, never
# real crew records. Artisan runs as www-data (-u) so it leaves no root-owned
# files in storage that php-fpm's workers could not write.
#
# Reaching it:
#   http://<server LAN or Tailscale IP>/       portal + API, on port 80
#   hris --profile tunnel up -d                also start a Cloudflare quick tunnel
#   hris logs tunnel | grep trycloudflare      shows its public https URL
#   A quick tunnel gets a NEW random URL every time it restarts, so the mobile
#   app's API address must be updated to match. A domain-backed named tunnel
#   removes that problem later.
#
# Transport security (decided with the team): the origin listens on plain HTTP
# for the LAN demo. The internet hop (client -> Cloudflare -> cloudflared ->
# nginx) is always TLS-encrypted inside the tunnel; cloudflared -> nginx never
# leaves the Docker bridge. The genuinely plaintext segment is the LAN itself,
# where the mobile app's bearer token crosses the wire in the clear — if the
# demo runs on a shared/untrusted network, put HTTPS in front before showing
# it. Login/rate-limit keys and audit IPs are real: nginx appends the client to
# X-Forwarded-For and Laravel trusts only the Docker bridge CIDR
# (backend/bootstrap/app.php), so a forged XFF header is ignored. Verified with
# a spoofed XFF through nginx from a source outside the bridge.
#
# Caveat: Docker Desktop presents every published-port client as the bridge
# gateway (e.g. 172.20.0.1), which IS inside the trust range, so local test
# traffic can look spoofed. On the Linux target server, iptables DNAT preserves
# the real client source IP, so LAN clients (192.168.x / 10.x / Tailscale
# 100.64.x) are recorded correctly.
#
# Memory: mem_limit is set per service for the 7GB box. api = 1g against a
# 256M-per-worker cap with pm.max_children = 3 (docker/php-fpm-prod.conf):
# worst case (3 x 256M + opcache's shared 128M + the master) fits under 1g, so
# a spike fails with a PHP memory error rather than an OOM kill. The six Redis
# nodes are 128m each (a 64mb cache apiece, see x-redis): about 4.5g in all,
# leaving the rest for Ubuntu and the page cache.
#
# MySQL, php-fpm and Redis publish no ports: only nginx (80) is reachable from
# outside. Data: mysql-data (database) and api-storage (Laravel storage). Back
# up with deploy/backup.sh; the disk is an old spinning drive. Redis holds
# nothing worth backing up — it is a cache, and MySQL has everything in it.

name: hris

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set APP_KEY in .env.prod}
  APP_URL: ${APP_URL:?set APP_URL in .env.prod}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: hris
  DB_USERNAME: hris
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
  # Nothing uses sessions today, but the default driver (database) has no table
  # and the first session-based feature would 500. file needs no schema and
  # lands on the api-storage volume.
  SESSION_DRIVER: file
  HRIS_REQUIRE_HARDWARE_KEYS: ${HRIS_REQUIRE_HARDWARE_KEYS:-false}
  # Cache on the Redis cluster below (the Redis add-on, CLAUDE.md §2), the
  # same way as in development. The store is `failover` (config/cache.php):
  # Redis first, MySQL's cache table whenever Redis cannot answer, and
  # App\Support\ResilientCache stops a dead cluster from costing every request
  # a connection attempt. So Redis being down makes the system slower, never
  # wrong and never unavailable — docs/REDIS_CLUSTER_RUNBOOK.md.
  # CACHE_STORE=database in .env.prod takes Redis out of the path altogether.
  CACHE_STORE: ${CACHE_STORE:-failover}
  REDIS_CLIENT: phpredis
  REDIS_CACHE_CONNECTION: cluster
  # All six, by fixed address (see redis-1): after a failover the primaries
  # may be the nodes that started as replicas, and a stopped node's NAME takes
  # Docker's DNS seconds to fail where its address fails in 0.5s.
  REDIS_CLUSTER_NODES: "172.28.201.11:6379,172.28.201.12:6379,172.28.201.13:6379,172.28.201.14:6379,172.28.201.15:6379,172.28.201.16:6379"
  # Every setting an operator can override must appear here (with its default)
  # AND in .env.prod.example: `--env-file` only substitutes compose variables,
  # it does not inject env vars into containers. Values default to the same
  # defaults the backend config would use if unset, so empty .env.prod lines
  # behave identically to a fresh checkout.
  HRIS_TIME_OUT_TRACKED_FROM: ${HRIS_TIME_OUT_TRACKED_FROM:-2026-09-21}
  HRIS_REGIONAL_MINIMUM_WAGE: ${HRIS_REGIONAL_MINIMUM_WAGE:-501.00}
  HRIS_WORK_DAYS: ${HRIS_WORK_DAYS:-1,2,3,4,5,6}
  HRIS_REST_DAY_ISO: ${HRIS_REST_DAY_ISO:-7}
  HRIS_SHIFT_START: ${HRIS_SHIFT_START:-07:00}
  HRIS_SHIFT_END: ${HRIS_SHIFT_END:-16:00}
  HRIS_MEAL_START: ${HRIS_MEAL_START:-12:00}
  HRIS_MEAL_END: ${HRIS_MEAL_END:-13:00}
  HRIS_RECOVERY_LOOKBACK_DAYS: ${HRIS_RECOVERY_LOOKBACK_DAYS:-14}
  HRIS_CLOCK_SKEW_TOLERANCE: ${HRIS_CLOCK_SKEW_TOLERANCE:-120}
  HRIS_LATE_OVERRIDE_GRACE_MINUTES: ${HRIS_LATE_OVERRIDE_GRACE_MINUTES:-15}
  HRIS_ATTENDANCE_TIMEZONE: ${HRIS_ATTENDANCE_TIMEZONE:-Asia/Manila}

x-redis: &redis
  image: redis:7-alpine
  restart: unless-stopped
  mem_limit: 128m
  logging: *logging
  # Cache only: no appendonly, no RDB snapshots — losing a node loses cached
  # copies, never data. maxmemory keeps each node inside its mem_limit: when
  # full, it evicts the least recently used entry that has an expiry
  # (volatile-lru) instead of growing until the kernel kills it. Only the
  # namespace version counters (ResilientCache) are kept without an expiry,
  # and those are the keys that must survive, or an edit could stop showing.
  command:
    - redis-server
    - --cluster-enabled
    - "yes"
    - --cluster-config-file
    - nodes.conf
    - --cluster-node-timeout
    - "5000"
    - --appendonly
    - "no"
    - --save
    - ""
    - --protected-mode
    - "no"
    - --maxmemory
    - 64mb
    - --maxmemory-policy
    - volatile-lru
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 10s
    timeout: 3s
    retries: 20

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 2g
    logging: *logging
    environment:
      MYSQL_DATABASE: hris
      MYSQL_USER: hris
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
    # Sized for 7GB RAM shared with PHP and nginx, on a spinning disk.
    command:
      - --innodb-buffer-pool-size=1G
      - --max-connections=60
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  api:
    image: hris-api:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    mem_limit: 1g
    logging: *logging
    environment:
      <<: *api-env
      # Kept in the api service (not x-api-env) so the scheduler does not inherit
      # it and race a migrate against the API on boot. --force is idempotent.
      HRIS_MIGRATE_ON_START: ${HRIS_MIGRATE_ON_START:-true}
    volumes:
      - api-storage:/var/www/html/storage
    # `redis` as well as the default: a cluster client is redirected to each
    # node's own address, which only resolves on the network the nodes are on.
    networks: [default, redis]
    # Deliberately no dependency on Redis: a cache that has not formed yet, or
    # never does, must not keep the API from starting. Until the cluster is
    # up, the failover store answers from MySQL.
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  scheduler:
    # Ends expired acting-foreman covers (routes/console.php).
    image: hris-api:prod
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    user: www-data
    environment:
      <<: *api-env
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - api-storage:/var/www/html/storage
    networks: [default, redis]
    depends_on:
      api:
        condition: service_healthy

  web:
    image: hris-web:prod
    build:
      context: ./web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # nginx serves /index.html itself; checking it (not /up, which proxies to
      # the API) keeps this container's health decoupled from the API's.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Redis Cluster: three primaries, each with one replica. On one machine this
  # demonstrates failover, not high availability — the box itself is still a
  # single point of failure (docs/REDIS_CLUSTER_RUNBOOK.md §2).
  #
  # Fixed addresses, and this is load-bearing. A node remembers the cluster in
  # nodes.conf, which survives a restart (the image keeps /data in a volume),
  # but Docker hands addresses out afresh each time containers start. Measured
  # in development: after a recreate, redis-5 was given redis-1's old address,
  # its saved topology said its own primary was itself, and the failover this
  # exists for was quietly gone while cluster_state still read ok. With fixed
  # addresses what a node remembers stays true — also after the server
  # reboots, when Docker restarts the nodes and they re-form the cluster.
  redis-1:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.201.11}}
  redis-2:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.201.12}}
  redis-3:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.201.13}}
  redis-4:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.201.14}}
  redis-5:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.201.15}}
  redis-6:
    <<: *redis
    networks: {redis: {ipv4_address: 172.28.201.16}}

  redis-cluster-init:
    # Runs once per `up`, then exits (so `hris ps` lists it only with -a): it
    # forms the cluster if it is not formed already, so a redeploy never tears
    # a working cluster down.
    image: redis:7-alpine
    restart: "no"
    logging: *logging
    networks: [redis]
    depends_on:
      redis-1: {condition: service_healthy}
      redis-2: {condition: service_healthy}
      redis-3: {condition: service_healthy}
      redis-4: {condition: service_healthy}
      redis-5: {condition: service_healthy}
      redis-6: {condition: service_healthy}
    entrypoint: ["sh", "-c"]
    # One folded line: every line here is indented the same, so YAML joins them
    # with spaces. Indenting any of them further would keep the newline and
    # split the command into pieces.
    command:
      - >
        if redis-cli -h redis-1 cluster info 2>/dev/null | grep -q 'cluster_state:ok';
        then echo 'Redis cluster already formed.';
        else redis-cli --cluster create
        redis-1:6379 redis-2:6379 redis-3:6379 redis-4:6379 redis-5:6379 redis-6:6379
        --cluster-replicas 1 --cluster-yes;
        fi

  tunnel:
    # Optional: a free Cloudflare quick tunnel, so the app is reachable from
    # outside the LAN with no domain, no account and no router changes.
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      - web

networks:
  default:
  redis:
    # Internal: nothing outside Docker can route in and the nodes cannot reach
    # out. Only api and scheduler join it. There is no Redis password because
    # nothing else can reach the nodes, and what they hold are copies of what
    # those two containers already read from MySQL.
    #
    # A /24 of its own for the fixed addresses — not development's
    # 172.28.200.0/24, so both stacks can run on one machine. If it clashes
    # with a network on the server, change the subnet and the six addresses
    # (here and in REDIS_CLUSTER_NODES) together, then `hris down` and
    # `hris up -d` to form a fresh cluster.
    internal: true
    ipam:
      config:
        - subnet: 172.28.201.0/24

volumes:
  mysql-data:
  api-storage:
